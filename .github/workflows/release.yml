name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi
      # The checks from ci.yml's verify job, so only a verified build is published.
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run test:browser
      - run: npm run build:extension-native
      - run: npm run test:browser-native
      - run: npm run package
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "release/snapscreen-${GITHUB_REF_NAME#v}.zip"
          --title "SnapScreen ${GITHUB_REF_NAME#v}"
          --generate-notes
          --verify-tag
