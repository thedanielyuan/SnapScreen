name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # main's ruleset requires this job by name.
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      # The core's tests, including the golden fixture replays.
      - run: swift test
      # With no signing certificate here, it signs ad hoc.
      - run: scripts/build-app.sh
      - run: build/SnapScreen.app/Contents/MacOS/SnapScreen --self-test
      # The test-hooks app snips a made-up capture through real windows with scripted answers; needs
      # the runner's GUI session.
      - run: scripts/test-app-live.sh
